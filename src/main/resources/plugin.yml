name: aSell
version: 1.0.0
main: io.github.airtonweb.asell.aSell
api-version: '1.21'
author: airton-web
description: Venda seus Minérios e Plantações.
commands:
  vender:
    description: Venda seus Minérios e Plantações.
    aliases: [sell, vendas]
    usage: /vender

permissions:
  asell.vender:
    description: Venda seus Minérios e Plantações.
    default: true
  asell.vender.minerios:
    description: Venda somente de Minérios.
    default: true
  asell.vender.farm:
    description: Venda somente de Plantações.
    default: true

  asell.vender.tudo:
    description: Venda Todos os Minérios e Plantações.
    default: true